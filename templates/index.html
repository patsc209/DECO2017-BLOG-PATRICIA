<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Blog</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="page-home">

    <header class="page-hero">
        <img class="header-banner-img" src="assets/header-banner.png" alt="" width="736" height="414" decoding="async">
        <div class="hero-inner">
            <img class="header-avatar" src="assets/profile.png" alt="Profile photo" width="914" height="1024" decoding="async">
            <div class="hero-titles">
                <h1 class="site-title">Welcome to Patricia's Blog!</h1>
                <p class="site-subtitle-bar">Patricia loves coding, cats, and coffee.</p>
            </div>
        </div>
    </header>

    <main class="home-main">
        <h2 class="section-label">
            <span class="section-label-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
            </span>
            Blog posts
        </h2>

        <ul class="post-grid">
            {{postList}}
        </ul>
    </main>

</body>

</html>
