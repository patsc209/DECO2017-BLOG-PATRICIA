<li class="post-item">

    <img src="photos/{{icon}}" alt="" class="post-icon">

    <div class="post-content">
    <a href="{{slug}}.html">{{title}}</a>

    <span class="date">{{date}}</span>

    <span class="author">{{author}}</span>

    <p class="summary">{{summary}}</p>

    <ul class="tags-list">
        {{tags}}
    </ul>
    </div>

</li>
